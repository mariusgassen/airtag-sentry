# Copy to config.yaml and adjust. Secrets and infra values (DB, VAPID, notifier
# credentials) live in .env instead — see .env.example.

apple:
  store_path: "data/account.json"
  anisette:
    mode: local # local | remote
    libs_path: "data/ani_libs.bin"
    remote_url: null # e.g. http://anisette:6969, used when mode: remote

airtags:
  # One entry per AirTag. Each `id` must be unique and is used to derive its
  # env var name for AIRTAG_PRIVATE_KEY_B64_<ID> (id uppercased, non-alphanumeric
  # chars replaced by `_`). Exactly one key source is required per entry: either
  # set accessory_json_path here, or set the corresponding env var in .env.
  # accessory_json_path points to a FindMyAccessory export - extract one with
  # `python -m findmy decrypt --out-dir data/keys` (see README: "Extracting your
  # AirTag key").
  - id: "bike"
    name: "Fahrrad"
    accessory_json_path: null
  # - id: "backpack"
  #   name: "Rucksack"
  #   accessory_json_path: "data/keys/backpack.json"

polling:
  interval_minutes: 15

movement:
  # Normal "it moved" alert.
  distance_threshold_meters: 100
  # A smaller move only matters once the tag has been stationary this long.
  stillstand_hours: 24
  stillstand_movement_meters: 15
  # Suppress alerts for the ~7 days of history backfilled on the very first poll.
  alert_on_backfill: false

web:
  host: "0.0.0.0"
  port: 8000
