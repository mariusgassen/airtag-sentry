<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f6feb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "black" (opaque), not "black-translucent": on an installed iOS
         home-screen PWA, black-translucent makes WebKit size the WebView to
         screen.height minus only the top safe-area inset, anchored at the
         top - the bottom safe-area strip is then physical OS-black outside
         the WebView entirely, unreachable by any CSS/JS (100dvh, fixed
         inset-0, safe-area-inset-bottom padding all measure the WebView
         itself and can't fill a gap that lies outside it). "black" makes
         WebKit lay out the WebView edge-to-edge and paint an opaque status
         bar on top instead, which is what actually fixes the dead-space gap
         above the home indicator that App.tsx's fixed+inset-0 comment
         describes chasing. Trade-off: the opaque bar also covers the
         App.tsx glass panel that used to let the map bleed through
         translucently under black-translucent - there's no third mode that
         gets edge-to-edge sizing AND see-through content on the affected
         WebKit versions. src/theme.ts overwrites this content value at
         runtime (default for light, black for dark) so at least the opaque
         bar's color matches the current theme's background instead of
         showing a jarring black band on the light theme. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <title>AirTagSentry</title>
    <script>
      // Runs before first paint so a forced light/dark choice never flashes
      // the wrong theme - src/theme.ts owns this key and reapplies it once
      // React mounts.
      try {
        var t = localStorage.getItem('airtagsentry.theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
