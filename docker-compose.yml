services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  anisette:
    image: dadoum/anisette-v3-server
    restart: unless-stopped

  app:
    build: .
    restart: unless-stopped
    command: ["run"]
    depends_on:
      postgres:
        condition: service_healthy
      anisette:
        condition: service_started
    # env_file for plain `docker compose up`; the explicit environment: block
    # below is what makes each variable show up individually in Coolify's UI.
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_ALLOWED_LOGIN: ${GITHUB_ALLOWED_LOGIN}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      AIRTAG_KEY_ENCRYPTION_KEY: ${AIRTAG_KEY_ENCRYPTION_KEY}
      NTFY_TOPIC_URL: ${NTFY_TOPIC_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      # Bundled anisette container, not the in-process generator - fixed by
      # this compose topology, not something to set in .env.
      ANISETTE_MODE: remote
      ANISETTE_REMOTE_URL: http://anisette:6969
      POLLING_INTERVAL_MINUTES: ${POLLING_INTERVAL_MINUTES}
      MOVEMENT_DISTANCE_THRESHOLD_METERS: ${MOVEMENT_DISTANCE_THRESHOLD_METERS}
      MOVEMENT_STILLSTAND_HOURS: ${MOVEMENT_STILLSTAND_HOURS}
      MOVEMENT_STILLSTAND_MOVEMENT_METERS: ${MOVEMENT_STILLSTAND_MOVEMENT_METERS}
      MOVEMENT_ALERT_ON_BACKFILL: ${MOVEMENT_ALERT_ON_BACKFILL}
    volumes:
      - app_data:/app/data

  dashboard:
    build: .
    restart: unless-stopped
    command: ["serve"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_ALLOWED_LOGIN: ${GITHUB_ALLOWED_LOGIN}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      AIRTAG_KEY_ENCRYPTION_KEY: ${AIRTAG_KEY_ENCRYPTION_KEY}
      NTFY_TOPIC_URL: ${NTFY_TOPIC_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      POLLING_INTERVAL_MINUTES: ${POLLING_INTERVAL_MINUTES}
    volumes:
      - app_data:/app/data:ro

volumes:
  postgres_data:
  app_data:
