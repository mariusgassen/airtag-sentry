services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  anisette:
    image: dadoum/anisette-v3-server
    restart: unless-stopped

  app:
    build: .
    restart: unless-stopped
    command: ["run"]
    depends_on:
      postgres:
        condition: service_healthy
      anisette:
        condition: service_started
    # No healthcheck here: this process has no HTTP surface to probe (it's the
    # scheduler loop, see scheduler.py), so Docker/Coolify's own "is the
    # container still running" state is what tracks its health - the same
    # signal `restart: unless-stopped` already acts on.
    # env_file for plain `docker compose up`; the explicit environment: block
    # below is what makes each variable show up individually in Coolify's UI.
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_ALLOWED_LOGIN: ${GITHUB_ALLOWED_LOGIN}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      AIRTAG_KEY_ENCRYPTION_KEY: ${AIRTAG_KEY_ENCRYPTION_KEY}
      NTFY_TOPIC_URL: ${NTFY_TOPIC_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      # Bundled anisette container, not the in-process generator - fixed by
      # this compose topology, not something to set in .env.
      ANISETTE_MODE: remote
      ANISETTE_REMOTE_URL: http://anisette:6969
    volumes:
      - app_data:/app/data

  dashboard:
    build: .
    restart: unless-stopped
    command: ["serve"]
    depends_on:
      postgres:
        condition: service_healthy
    # The image is python:3.14-slim (no curl/wget), so probe with the
    # interpreter that's already there. Hardcodes WEB_PORT's fixed default
    # (see the README's Coolify section for why WEB_PORT isn't overridable)
    # and hits it from inside the container, so it's unaffected by
    # SERVICE_FQDN_DASHBOARD_8000/TLS termination at Coolify's edge.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_ALLOWED_LOGIN: ${GITHUB_ALLOWED_LOGIN}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      AIRTAG_KEY_ENCRYPTION_KEY: ${AIRTAG_KEY_ENCRYPTION_KEY}
      NTFY_TOPIC_URL: ${NTFY_TOPIC_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
    volumes:
      - app_data:/app/data:ro

volumes:
  postgres_data:
  app_data:
