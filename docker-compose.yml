services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  anisette:
    image: dadoum/anisette-v3-server
    restart: unless-stopped
    # Without this, every container restart/redeploy wipes its provisioned
    # device identity, forcing it to register as a brand-new "device" with
    # Apple from scratch on the next request. A burst of restarts in a short
    # window (e.g. several redeploys while iterating on a fix) can trip
    # Apple's abuse detection and produce transient 503s on unrelated
    # requests (GSA auth, 2FA submission) that have nothing to do with this
    # app's own code.
    #
    # Mounted at .../anisette-v3/ itself, NOT .../anisette-v3/lib/: per the
    # image's own source (source/app.d), the persistent device identity
    # (device.json, holding the machine ID/UUID Apple actually keys trust
    # off) is written directly into configurationPath (~/.config/anisette-v3),
    # while lib/ underneath it only caches two downloadable Apple libraries
    # (libCoreADI.so/libstoreservicescore.so) - not identity-bearing at all.
    # A previous version of this mount only covered lib/, silently missing
    # device.json and defeating the whole point of this volume without
    # erroring - every redeploy was still generating a fresh device each
    # time. The upstream README's own example (github.com/Dadoum/anisette-v3-server)
    # mounts only lib/ too, so don't copy that without checking the source
    # first if this image is ever updated.
    volumes:
      - anisette_data:/home/Alcoholic/.config/anisette-v3/

  dashboard:
    build: .
    restart: unless-stopped
    command: ["serve"]
    depends_on:
      postgres:
        condition: service_healthy
      anisette:
        condition: service_started
    # The image is python:3.14-slim (no curl/wget), so probe with the
    # interpreter that's already there. Hardcodes WEB_PORT's fixed default
    # (see the README's Coolify section for why WEB_PORT isn't overridable)
    # and hits it from inside the container, so it's unaffected by
    # SERVICE_FQDN_DASHBOARD_8000/TLS termination at Coolify's edge.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # env_file for plain `docker compose up`; the explicit environment: block
    # below is what makes each variable show up individually in Coolify's UI.
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_ALLOWED_EMAIL: ${OIDC_ALLOWED_EMAIL}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      AIRTAG_KEY_ENCRYPTION_KEY: ${AIRTAG_KEY_ENCRYPTION_KEY}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      # Bundled anisette container, not the in-process generator - fixed by
      # this compose topology, not something to set in .env.
      ANISETTE_MODE: remote
      ANISETTE_REMOTE_URL: http://anisette:6969
    volumes:
      # Read-write (not :ro): the Settings panel's Apple-ID login flow, the
      # poller, and migrations all run in this one service, and each writes
      # here - the AirTag session file (APPLE_STORE_PATH), the owner-tracking
      # session cache (APPLE_OWNER_SESSION_PATH).
      - app_data:/app/data

volumes:
  postgres_data:
  app_data:
  anisette_data:
