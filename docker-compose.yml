services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  anisette:
    image: dadoum/anisette-v3-server
    restart: unless-stopped

  app:
    build: .
    restart: unless-stopped
    command: ["run"]
    depends_on:
      postgres:
        condition: service_healthy
      anisette:
        condition: service_started
    # env_file for plain `docker compose up`; the explicit environment: block
    # below is what makes each variable show up individually in Coolify's UI.
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_ALLOWED_LOGIN: ${GITHUB_ALLOWED_LOGIN}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      AIRTAG_KEY_ENCRYPTION_KEY: ${AIRTAG_KEY_ENCRYPTION_KEY}
      NTFY_TOPIC_URL: ${NTFY_TOPIC_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
    volumes:
      - app_data:/app/data
      - ./config.yaml:/app/config.yaml:ro

  dashboard:
    build: .
    restart: unless-stopped
    command: ["serve"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_ALLOWED_LOGIN: ${GITHUB_ALLOWED_LOGIN}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      AIRTAG_KEY_ENCRYPTION_KEY: ${AIRTAG_KEY_ENCRYPTION_KEY}
      NTFY_TOPIC_URL: ${NTFY_TOPIC_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
    volumes:
      - app_data:/app/data:ro
      - ./config.yaml:/app/config.yaml:ro

volumes:
  postgres_data:
  app_data:
