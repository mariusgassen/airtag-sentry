[project]
name = "airtag-sentry"
version = "0.1.0"
description = "Self-hosted location history and movement alerts for a single AirTag."
requires-python = ">=3.11"
dependencies = [
    # >=0.10.2: fixes a critical GSA (re)authentication issue caused by
    # changes on Apple's side (client was misidentifying itself, triggering
    # 503s from Apple) - affects every AirTag/owner-device login.
    # Note: findmy 0.10.2 sets Requires-Python >=3.10,<3.15 (blocks Python 3.15).
    "findmy>=0.10.2",
    "psycopg[binary]>=3.3.9",
    "apscheduler>=3.11.3",
    "fastapi>=0.163.0",
    "uvicorn[standard]>=0.54.0",
    "requests>=2.34.2",
    # authlib 1.8+ uses httpx2 for its async OAuth2/OIDC client (falling back
    # to httpx with a deprecation warning on every request if httpx2 is missing).
    "authlib>=1.9.5,<1.10",
    "httpx2>=2.16.0",
    "pywebpush>=2.5.0",
    "py-vapid>=1.9.6",
    "itsdangerous>=2.2.0",
    "cryptography>=50.0.2",
    # python:3.14-slim isn't guaranteed to ship /usr/share/zoneinfo - this
    # package is zoneinfo's documented fallback data source so TZ=Europe/Berlin
    # (see config.py's display_timezone) resolves regardless of the base image.
    "tzdata>=2026.6",
    "alembic>=1.20.1",
    "sqlalchemy>=2.1.8",
    # timlaing/pyicloud 2.6.4+ moved rich to optional [cli] / TYPE_CHECKING,
    # so the old explicit rich workaround is no longer required.
    "pyicloud>=2026.11.2",
    "paho-mqtt>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
    # Used by FastAPI/Starlette TestClient in tests.
    "httpx>=0.28.1",
    "ruff>=0.11.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["airtag_sentry*"]

[tool.setuptools.package-data]
# Without this, `pip install .` (what Dockerfile runs) silently ships a wheel
# with no dashboard assets at all - only `pip install -e .` happens to work,
# since it just adds the source tree to sys.path instead of repackaging it.
"airtag_sentry.web" = ["static/**/*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
# Never edit already-shipped migrations (CLAUDE.md); leave any legacy unused imports untouched.
"alembic/versions/*" = ["F401"]
