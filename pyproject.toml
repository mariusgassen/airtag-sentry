[project]
name = "airtag-sentry"
version = "0.1.0"
description = "Self-hosted location history and movement alerts for a single AirTag."
requires-python = ">=3.11"
dependencies = [
    "findmy>=0.9.6",
    "psycopg[binary]>=3.1",
    "apscheduler>=3.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "requests>=2.32",
    "pywebpush>=2.0",
    "py-vapid>=1.9",
    "itsdangerous>=2.1",
    "cryptography>=42",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "pyicloud>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["airtag_sentry*"]

[tool.setuptools.package-data]
# Without this, `pip install .` (what Dockerfile runs) silently ships a wheel
# with no dashboard assets at all - only `pip install -e .` happens to work,
# since it just adds the source tree to sys.path instead of repackaging it.
"airtag_sentry.web" = ["static/**/*"]
