<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AirTagSentry</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1f6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1117;
    --surface: #161b22;
    --surface-2: #1c2128;
    --border: #21262d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #1f6feb;
    --accent-2: #388bfd;
    --ok: #238636;
    --ok-hover: #2ea043;
    --warn: #9a6700;
    --danger: #da3633;
    --danger-hover: #f85149;
    --radius: 14px;
    --radius-sm: 8px;
    --shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom);
  }

  header.topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    padding: calc(0.9rem + env(safe-area-inset-top)) 1rem 0.9rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    justify-content: space-between;
    align-items: center;
    background: rgba(22, 27, 34, 0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }

  h1 { font-size: 1.05rem; font-weight: 650; margin: 0; letter-spacing: -0.01em; }

  .controls { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }

  select.select {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.5rem 0.7rem;
    font-size: 0.85rem;
    min-height: 40px;
  }

  button, .btn {
    font: inherit;
    border: none;
    border-radius: var(--radius-sm);
    padding: 0.55rem 0.9rem;
    min-height: 40px;
    cursor: pointer;
    transition: background-color 0.15s ease, transform 0.1s ease, opacity 0.15s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.35rem;
    font-size: 0.85rem;
  }
  button:active, .btn:active { transform: scale(0.97); }
  button:disabled { background: var(--surface-2); color: var(--text-dim); cursor: default; transform: none; }

  .btn-primary { background: var(--ok); color: white; }
  .btn-primary:hover:not(:disabled) { background: var(--ok-hover); }
  .btn-ghost { background: transparent; color: var(--text-dim); text-decoration: none; padding-inline: 0.6rem; }
  .btn-ghost:hover { color: var(--text); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .btn-danger:hover:not(:disabled) { background: var(--danger); color: white; }
  .icon-btn {
    background: var(--surface-2);
    color: var(--text);
    width: 40px; height: 40px; padding: 0;
    border-radius: 999px;
    font-size: 1.05rem;
  }
  .icon-btn:hover { background: var(--border); }

  main { padding: 1rem; max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 0.75rem;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.85rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }
  .stat-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); }
  .stat-value { font-size: 0.95rem; font-weight: 600; }
  .stat-card.has-alert { border-color: var(--warn); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .card-header {
    padding: 0.85rem 1rem 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-header h2 { font-size: 0.95rem; margin: 0; font-weight: 600; }

  .map-card #map { height: 55vh; min-height: 320px; width: 100%; }

  .table-wrap { max-height: 40vh; overflow: auto; padding: 0.5rem 0 0.25rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
  th, td { padding: 0.5rem 1rem; text-align: left; white-space: nowrap; }
  thead th { position: sticky; top: 0; background: var(--surface); color: var(--text-dim); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
  tbody tr { border-top: 1px solid var(--border); }
  tbody tr:hover { background: var(--surface-2); }

  .empty-state { padding: 2rem 1rem; text-align: center; color: var(--text-dim); font-size: 0.9rem; }

  /* Manage-AirTags overlay */
  .overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 100; padding: 0;
  }
  .overlay[hidden] { display: none; }

  .modal {
    background: var(--surface);
    border-top-left-radius: var(--radius);
    border-top-right-radius: var(--radius);
    width: 100%; max-width: 600px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 1rem 1rem calc(1.25rem + env(safe-area-inset-bottom));
    box-shadow: var(--shadow);
  }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; position: sticky; top: 0; background: var(--surface); padding-top: 0.1rem; }
  .modal-header h2 { margin: 0; font-size: 1.05rem; }

  .airtag-row {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.85rem;
    margin-bottom: 0.75rem;
  }
  .airtag-row-header { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.6rem; flex-wrap: wrap; }
  .airtag-row-header strong { font-size: 0.95rem; }

  .pill {
    font-size: 0.72rem;
    padding: 0.2rem 0.55rem;
    border-radius: 999px;
    white-space: nowrap;
  }
  .pill-ok { background: rgba(35, 134, 54, 0.2); color: #56d364; }
  .pill-warn { background: rgba(154, 103, 0, 0.2); color: #d29922; }

  .segmented { display: inline-flex; background: var(--surface-2); border-radius: var(--radius-sm); padding: 3px; margin-bottom: 0.5rem; }
  .seg-btn { background: transparent; color: var(--text-dim); min-height: 32px; padding: 0.3rem 0.7rem; font-size: 0.78rem; border-radius: calc(var(--radius-sm) - 3px); }
  .seg-btn.active { background: var(--surface); color: var(--text); }

  textarea.b64-input {
    width: 100%;
    min-height: 70px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.6rem;
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: 0.78rem;
    resize: vertical;
  }

  .file-drop {
    border: 1px dashed var(--border);
    border-radius: var(--radius-sm);
    padding: 0.8rem;
    text-align: center;
    font-size: 0.8rem;
    color: var(--text-dim);
    cursor: pointer;
  }
  .file-drop.has-file { color: var(--text); border-style: solid; }

  .row-actions { display: flex; gap: 0.5rem; margin-top: 0.6rem; flex-wrap: wrap; }
  .hint { font-size: 0.72rem; color: var(--text-dim); margin-top: 0.4rem; }

  @media (max-width: 480px) {
    h1 { font-size: 0.95rem; }
    .btn span.label { display: none; }
  }
</style>
</head>
<body>
<header class="topbar">
  <h1 id="title">AirTagSentry</h1>
  <div class="controls">
    <select id="airtag-select" class="select"></select>
    <button id="settings-btn" class="icon-btn" type="button" aria-label="AirTags verwalten" title="AirTags verwalten">⚙️</button>
    <button id="enable-push" class="btn btn-primary" type="button">🔔<span class="label">Benachrichtigungen</span></button>
    <a id="logout" class="btn btn-ghost" href="/logout">Abmelden</a>
  </div>
</header>

<main>
  <section class="stat-grid" id="stat-grid">
    <div class="stat-card">
      <span class="stat-label">Letzter Report</span>
      <span class="stat-value" id="stat-last-report">Lade…</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Polling-Intervall</span>
      <span class="stat-value" id="stat-poll-interval">–</span>
    </div>
    <div class="stat-card" id="stat-alert-card">
      <span class="stat-label">Letzter Alarm</span>
      <span class="stat-value" id="stat-last-alert">Keiner</span>
    </div>
  </section>

  <section class="card map-card">
    <div id="map"></div>
  </section>

  <section class="card">
    <div class="card-header"><h2>Verlauf</h2></div>
    <div id="reports-wrap" class="table-wrap">
      <table>
        <thead><tr><th>Zeit</th><th>Lat</th><th>Lon</th><th>Genauigkeit</th></tr></thead>
        <tbody id="reports-body"></tbody>
      </table>
    </div>
  </section>
</main>

<div id="settings-overlay" class="overlay" hidden>
  <div class="modal">
    <div class="modal-header">
      <h2>AirTags verwalten</h2>
      <button id="settings-close" class="icon-btn" type="button" aria-label="Schließen">✕</button>
    </div>
    <div id="airtag-list"></div>
    <p class="hint">
      Schlüssel extrahieren: <code>python -m findmy decrypt --out-dir data/keys</code>
      auf dem Mac, auf dem das AirTag eingerichtet ist. Details siehe README.
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let currentAirtagId = null;
let map = null;
let currentLayer = null;

function renderMap(reports) {
  const mapEl = document.getElementById('map');
  if (reports.length === 0) {
    if (map) { map.remove(); map = null; currentLayer = null; }
    mapEl.innerHTML = '<div class="empty-state">Keine Standortdaten vorhanden.</div>';
    return;
  }
  if (!map) {
    mapEl.innerHTML = '';
    map = L.map('map');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
    }).addTo(map);
  }
  if (currentLayer) {
    map.removeLayer(currentLayer);
  }
  const latlngs = reports.map(r => [r.lat, r.lon]);
  currentLayer = L.layerGroup([
    L.polyline(latlngs, { color: '#1f6feb', weight: 4 }),
    L.marker(latlngs[latlngs.length - 1]).bindPopup('Letzte Position'),
  ]).addTo(map);
  map.fitBounds(latlngs, { padding: [24, 24] });
}

async function fetchAirtags() {
  const res = await fetch('/api/airtags');
  if (res.status === 401) { location.href = '/login'; return null; }
  return res.json();
}

async function loadAirtagSelect() {
  const airtags = await fetchAirtags();
  if (!airtags) return;
  const select = document.getElementById('airtag-select');
  select.innerHTML = '';
  for (const a of airtags) {
    const opt = document.createElement('option');
    opt.value = a.id;
    opt.textContent = a.name;
    select.appendChild(opt);
  }
  currentAirtagId = airtags[0]?.id ?? null;
  select.addEventListener('change', () => {
    currentAirtagId = select.value;
    loadData();
  });
}

async function loadData() {
  const qs = currentAirtagId ? `airtag_id=${encodeURIComponent(currentAirtagId)}` : '';
  const [reportsRes, statusRes] = await Promise.all([
    fetch(`/api/reports?limit=500${qs ? '&' + qs : ''}`),
    fetch(`/api/status${qs ? '?' + qs : ''}`),
  ]);
  if (reportsRes.status === 401 || statusRes.status === 401) { location.href = '/login'; return; }
  const reports = await reportsRes.json();
  const status = await statusRes.json();
  document.getElementById('airtag-select').value = status.airtag_id;

  document.getElementById('title').textContent = `AirTagSentry — ${status.airtag_name}`;
  document.getElementById('stat-poll-interval').textContent = `alle ${status.poll_interval_minutes} min`;
  document.getElementById('stat-last-report').textContent = status.last_report
    ? new Date(status.last_report.timestamp).toLocaleString()
    : 'Noch keine Reports';

  const alertCard = document.getElementById('stat-alert-card');
  const alertValue = document.getElementById('stat-last-alert');
  if (status.last_alert) {
    alertCard.classList.add('has-alert');
    alertValue.textContent = `${status.last_alert.reason} · ${new Date(status.last_alert.timestamp).toLocaleString()}`;
  } else {
    alertCard.classList.remove('has-alert');
    alertValue.textContent = 'Keiner';
  }

  const tbody = document.getElementById('reports-body');
  tbody.innerHTML = '';
  for (const r of [...reports].reverse()) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${new Date(r.timestamp).toLocaleString()}</td><td>${r.lat.toFixed(5)}</td><td>${r.lon.toFixed(5)}</td><td>${r.accuracy ?? '-'}</td>`;
    tbody.appendChild(tr);
  }

  renderMap(reports);
}

(async () => {
  await loadAirtagSelect();
  await loadData();
})();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

document.getElementById('enable-push').addEventListener('click', async () => {
  const button = document.getElementById('enable-push');
  button.disabled = true;
  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      alert('Benachrichtigungen wurden nicht erlaubt.');
      button.disabled = false;
      return;
    }
    const keyRes = await fetch('/api/push/vapid-public-key');
    if (!keyRes.ok) {
      alert('Web Push ist serverseitig nicht konfiguriert.');
      button.disabled = false;
      return;
    }
    const { publicKey } = await keyRes.json();
    const registration = await navigator.serviceWorker.ready;
    const subscription = await registration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(publicKey),
    });
    await fetch('/api/push/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(subscription.toJSON()),
    });
    button.innerHTML = '✅<span class="label">Aktiv</span>';
  } catch (err) {
    console.error(err);
    alert('Aktivierung fehlgeschlagen: ' + err.message);
    button.disabled = false;
  }
});

// --- AirTags verwalten (key management) ---

const overlay = document.getElementById('settings-overlay');
const airtagList = document.getElementById('airtag-list');

document.getElementById('settings-btn').addEventListener('click', async () => {
  overlay.hidden = false;
  await renderAirtagList();
});
document.getElementById('settings-close').addEventListener('click', () => { overlay.hidden = true; });
overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.hidden = true; });

async function renderAirtagList() {
  const airtags = await fetchAirtags();
  if (!airtags) return;
  airtagList.innerHTML = '';
  for (const a of airtags) {
    airtagList.appendChild(buildAirtagRow(a));
  }
}

function buildAirtagRow(airtag) {
  const row = document.createElement('div');
  row.className = 'airtag-row';

  const pillClass = airtag.has_key ? 'pill-ok' : 'pill-warn';
  const pillText = airtag.has_key ? 'Schlüssel hinterlegt' : 'Kein Schlüssel';

  row.innerHTML = `
    <div class="airtag-row-header">
      <strong>${airtag.name}</strong>
      <span class="pill ${pillClass}">${pillText}</span>
    </div>
    <div class="segmented" role="tablist">
      <button type="button" class="seg-btn active" data-mode="b64">Base64-Schlüssel</button>
      <button type="button" class="seg-btn" data-mode="json">JSON-Datei</button>
    </div>
    <textarea class="b64-input" placeholder="Base64-Schlüssel einfügen"></textarea>
    <label class="file-drop json-input-wrap" style="display:none;">
      <input type="file" class="json-input" accept="application/json" hidden>
      <span class="file-drop-label">JSON-Datei auswählen (z. B. data/keys/bike.json)</span>
    </label>
    <div class="row-actions">
      <button type="button" class="btn btn-primary save-btn">Speichern</button>
      <button type="button" class="btn btn-danger remove-btn" ${airtag.has_key ? '' : 'disabled'}>Entfernen</button>
    </div>
  `;

  const b64Input = row.querySelector('.b64-input');
  const jsonWrap = row.querySelector('.json-input-wrap');
  const jsonInput = row.querySelector('.json-input');
  const jsonLabel = row.querySelector('.file-drop-label');
  const segButtons = row.querySelectorAll('.seg-btn');
  let mode = 'b64';
  let parsedJson = null;

  segButtons.forEach((btn) => {
    btn.addEventListener('click', () => {
      mode = btn.dataset.mode;
      segButtons.forEach((b) => b.classList.toggle('active', b === btn));
      b64Input.style.display = mode === 'b64' ? 'block' : 'none';
      jsonWrap.style.display = mode === 'json' ? 'flex' : 'none';
    });
  });

  jsonInput.addEventListener('change', async () => {
    const file = jsonInput.files[0];
    if (!file) return;
    try {
      parsedJson = JSON.parse(await file.text());
      jsonLabel.textContent = file.name;
      jsonWrap.classList.add('has-file');
    } catch (err) {
      alert('Ungültige JSON-Datei: ' + err.message);
      jsonInput.value = '';
      parsedJson = null;
    }
  });

  row.querySelector('.save-btn').addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    let body;
    if (mode === 'b64') {
      const value = b64Input.value.trim();
      if (!value) { alert('Bitte einen Base64-Schlüssel einfügen.'); return; }
      body = { private_key_b64: value };
    } else {
      if (!parsedJson) { alert('Bitte zuerst eine JSON-Datei auswählen.'); return; }
      body = { accessory_json: parsedJson };
    }
    btn.disabled = true;
    try {
      const res = await fetch(`/api/airtags/${encodeURIComponent(airtag.id)}/key`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (res.status === 401) { location.href = '/login'; return; }
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `HTTP ${res.status}`);
      }
      await renderAirtagList();
      await loadAirtagSelect();
      await loadData();
    } catch (err) {
      alert('Speichern fehlgeschlagen: ' + err.message);
    } finally {
      btn.disabled = false;
    }
  });

  row.querySelector('.remove-btn').addEventListener('click', async (e) => {
    if (!confirm(`Schlüssel für "${airtag.name}" wirklich entfernen?`)) return;
    const btn = e.currentTarget;
    btn.disabled = true;
    try {
      const res = await fetch(`/api/airtags/${encodeURIComponent(airtag.id)}/key`, { method: 'DELETE' });
      if (res.status === 401) { location.href = '/login'; return; }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      await renderAirtagList();
      await loadAirtagSelect();
      await loadData();
    } catch (err) {
      alert('Entfernen fehlgeschlagen: ' + err.message);
      btn.disabled = false;
    }
  });

  return row;
}
</script>
</body>
</html>
